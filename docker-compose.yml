# The whole newsroom: website, background worker, and Caddy (automatic HTTPS).
# Settings for the server itself live in .env (DOMAIN, SETUP_CODE). Everything else is in the dashboard.
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app", "worker"]
    volumes:
      - ./data:/data
    depends_on:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
